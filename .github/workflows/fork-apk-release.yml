name: Fork APK Release

# Every push to the fork's working branch publishes its full release APKs (and a debug APK), signed with the shared
# key (docs/shared-signing.md), as the latest release. The newest build is therefore always at
#   https://github.com/<owner>/<repo>/releases/latest/download/Nuvio.apk
#
# Secrets (repository settings > Secrets and variables > Actions):
#   NUVIO_LOCAL_PROPERTIES_BASE64   local.properties without sdk.dir and NUVIO_RELEASE_* lines
#   NUVIO_SHARED_KEYSTORE_BASE64    base64 of the shared keystore
#   NUVIO_SHARED_STORE_PASSWORD     its store password
#   NUVIO_SHARED_KEY_ALIAS          its key alias
#   NUVIO_SHARED_KEY_PASSWORD       its key password
# Without them the run skips the build (with a notice), so nothing unsigned is ever published.

on:
  push:
    branches: [feature/tv-remote]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-apk-release
  cancel-in-progress: true

env:
  SHARED_KEY_SHA256: 324d485c07dd86019fb438b0903c6e6849f2d4b651c56dc346e95fbbbb5f6b36

jobs:
  release:
    name: Build and publish Nuvio.apk
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check secrets
        id: secrets
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.NUVIO_SHARED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NUVIO_SHARED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVIO_SHARED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_SHARED_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$LOCAL_PROPERTIES_BASE64" ] || missing+=(NUVIO_LOCAL_PROPERTIES_BASE64)
          [ -n "$KEYSTORE_BASE64" ] || missing+=(NUVIO_SHARED_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(NUVIO_SHARED_STORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(NUVIO_SHARED_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(NUVIO_SHARED_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::Skipping: missing secrets ${missing[*]} (see the header of this workflow)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.secrets.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare properties and keystore
        if: steps.secrets.outputs.ready == 'true'
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.NUVIO_SHARED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NUVIO_SHARED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVIO_SHARED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_SHARED_KEY_PASSWORD }}
        run: |
          keystore="${RUNNER_TEMP}/nuvio-shared.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_[A-Z_]+|NUVIO_SIGN_DEBUG_WITH_RELEASE_KEY)[[:space:]]*=/d' local.properties
          {
            echo
            echo "NUVIO_RELEASE_STORE_FILE=$keystore"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties

      # Release first (optimized, one APK per ABI); the debug build is an extra download.
      - name: Build full release APKs
        if: steps.secrets.outputs.ready == 'true'
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Build full debug APK
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # The release build's Gradle and Kotlin daemons still hold several GB; with them running
          # the runner was killed for lack of memory during the debug build.
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Collect APKs and check they are signed with the shared key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          out="$RUNNER_TEMP/apks"
          mkdir -p "$out"
          # Nuvio-<abi>.apk per ABI (the in-app updater picks the device's), Nuvio.apk = arm64
          # for the fixed download link, Nuvio-debug.apk for debugging.
          for apk in androidApp/build/outputs/apk/full/release/androidApp-full-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^androidApp-full-(.+)-release\.apk$/\1/')
            cp "$apk" "$out/Nuvio-$abi.apk"
          done
          cp "$out/Nuvio-arm64-v8a.apk" "$out/Nuvio.apk"
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk "$out/Nuvio-debug.apk"
          for apk in "$out"/*.apk; do
            signer=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ "$signer" != "$SHARED_KEY_SHA256" ]; then
              echo "::error::$(basename "$apk") is signed with $signer, not the shared key."
              exit 1
            fi
          done
          ls -la "$out"

      - name: Publish release
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^MARKETING_VERSION *= *//p' iosApp/Configuration/Version.xcconfig | head -1)
          short=$(git rev-parse --short HEAD)
          # UTC commit time, the same stamp the app carries (AppVersionConfig.FORK_BUILD).
          tag="shad-$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d-%H%M HEAD)-$short"
          previous=$(gh release list --limit 20 --json tagName -q '.[].tagName' | grep '^shad-' | head -1 || true)
          {
            echo "Nuvio $version, branch \`${GITHUB_REF_NAME}\`, commit ${GITHUB_SHA}."
            echo
            echo "Signed with the shared key (SHA-256 \`$SHARED_KEY_SHA256\`)."
            echo
            if [ -n "$previous" ] && git rev-parse -q --verify "refs/tags/$previous" >/dev/null; then
              echo "Changes since $previous:"
              git log --no-merges --format='- %s' "$previous..$GITHUB_SHA"
            else
              echo "Recent changes:"
              git log --no-merges --format='- %s' -15 "$GITHUB_SHA"
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$RUNNER_TEMP"/apks/*.apk --target "$GITHUB_SHA" \
            --title "Nuvio $version ($(date -u +%Y-%m-%d))" --notes-file "$RUNNER_TEMP/notes.md" --latest
